<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Checker</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      width:400px;
      background:#111827;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:25px;
      padding:35px;
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
    }

    .logo{
      width:70px;
      height:70px;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      border-radius:20px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:30px;
      margin:auto;
      margin-bottom:20px;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
    }

    p{
      text-align:center;
      color:#94a3b8;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#1e293b;
      color:white;
      font-size:16px;
      outline:none;
      margin-bottom:15px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
    }

    .result{
      margin-top:25px;
      background:#1e293b;
      padding:20px;
      border-radius:15px;
      display:none;
    }

    .stock{
      font-size:28px;
      font-weight:bold;
      margin-top:10px;
      color:#22c55e;
    }

    .location{
      margin-top:8px;
      color:#cbd5e1;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      📦
    </div>

    <h1>Stock Checker</h1>

    <p>
      Cek ketersediaan barang dengan cepat
    </p>

    <input
      type="text"
      id="search"
      placeholder="Masukkan nama barang"
    >

    <button onclick="checkStock()">
      Check Stock
    </button>

    <div class="result" id="resultBox">

      <h2 id="itemName"></h2>

      <div class="stock" id="stock"></div>

      <div class="location" id="location"></div>

    </div>

  </div>

<script>

const items = [

  {
    name:"Bolt M28",
    stock:24,
    location:"Rack A1"
  },

  {
    name:"Filter Oli",
    stock:8,
    location:"Rack B2"
  },

  {
    name:"Hydraulic Hose",
    stock:15,
    location:"Rack C1"
  }

]

function checkStock(){

  const keyword =
    document
    .getElementById("search")
    .value
    .toLowerCase()

  const item =
    items.find(data =>
      data.name.toLowerCase() === keyword
    )

  const resultBox =
    document.getElementById("resultBox")

  if(item){

    resultBox.style.display = "block"

    document.getElementById("itemName")
    .innerText = item.name

    document.getElementById("stock")
    .innerText = item.stock + " pcs tersedia"

    document.getElementById("location")
    .innerText = "Lokasi: " + item.location

  }

  else{

    resultBox.style.display = "block"

    document.getElementById("itemName")
    .innerText = "Barang tidak ditemukan"

    document.getElementById("stock")
    .innerText = ""

    document.getElementById("location")
    .innerText = ""

  }

}

</script>

</body>
</html>
